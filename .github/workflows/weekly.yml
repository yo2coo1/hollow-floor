# Hollow Floor weekly workflow (schedule owned by the repo owner account)
# Weekly: learning report (what worked) + self-test of every step except real posting.
name: weekly
on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * 0"  # Sundays
concurrency: {group: hollow-floor, cancel-in-progress: false}
permissions: {contents: read}
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_REVIEWS_CHANNEL_ID: ${{ secrets.DISCORD_REVIEWS_CHANNEL_ID }}
      DISCORD_ALERTS_CHANNEL_ID: ${{ secrets.DISCORD_ALERTS_CHANNEL_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      CHROME_PATH: /usr/bin/google-chrome
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: "${{ github.repository_owner }}/hollow-floor-data", ssh-key: "${{ secrets.DATA_DEPLOY_KEY }}", path: hfdata}
      - run: rm -rf stories data && mkdir -p hfdata/stories hfdata/data && ln -s hfdata/stories stories && ln -s hfdata/data data
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "requirements-cloud.txt\nrequirements-voice.txt"}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - run: pip install -r requirements-cloud.txt && npm ci && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python -m venv .venv-cbx && .venv-cbx/bin/pip install -q --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-voice.txt
      - uses: actions/cache@v4
        with: {path: "models\n~/.cache/huggingface", key: models-kokoro-v1-int8-whisper-base-en-chatterbox-0.1.7}
      - run: |
          mkdir -p models && cd models
          for f in kokoro-v1.0.int8.onnx voices-v1.0.bin; do [ -f "$f" ] || curl -sSfL -o "$f" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"; done
      - run: |   # log kept privately in the data repo (public repo = public logs)
          mkdir -p data/logs; rc=0
          python -m hollowfloor.pipeline weekly > "data/logs/weekly-${{ github.run_id }}.log" 2>&1 || rc=$?
          echo "weekly exit code $rc"; exit $rc
      - if: always()
        run: |
          cd hfdata && git config user.name "hollow-floor-bot" && git config user.email "noreply@localhost"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "weekly ${{ github.run_id }}"
          for i in 1 2 3; do git push -q && exit 0; git pull --rebase -q || { git rebase --abort; exit 1; }; done
          exit 1
