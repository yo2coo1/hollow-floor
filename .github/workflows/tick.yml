# Hollow Floor: the scheduled pipeline run (schedule owned by the repo owner account). Picks up work by status, so overlapping or failed runs are safe.
name: tick
on:
  workflow_dispatch:
    inputs:
      dry_run: {description: "Do everything except really posting", type: boolean, default: true}
      scratch: {description: "Use a throwaway copy of the database (test run, nothing saved)", type: boolean, default: true}
  schedule:
  # 8 runs a day at the moments that matter, not hourly (saves free minutes). Times are UTC; New York = UTC-5 (UTC-4 in summer).
    - cron: "17 9 * * *"   # 04:17 NY  votes close for 12:00 Part 1s; plan/render tomorrow's slots
    - cron: "17 14 * * *"  # 09:17 NY  votes close for 17:00 Part 1s
    - cron: "2 17 * * *"   # 12:02 NY  post slot 1
    - cron: "24 17 * * *"  # 12:24 NY  backup (GitHub sometimes delays or drops scheduled runs)
    - cron: "37 18 * * *"  # 13:37 NY  votes close for 21:00 Part 1s; late approvals
    - cron: "2 22 * * *"   # 17:02 NY  post slot 2
    - cron: "24 22 * * *"  # 17:24 NY  backup
    - cron: "2 2 * * *"    # 21:02 NY  post slot 3
    - cron: "24 2 * * *"   # 21:24 NY  backup
    - cron: "30 3 * * *"   # 22:30 NY  daily summary
    - cron: "30 6 * * *"   # 01:30 NY  catch-up (reviews answered overnight)
concurrency: {group: hollow-floor, cancel-in-progress: false}
permissions: {contents: read, actions: read, issues: write}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_REVIEWS_CHANNEL_ID: ${{ secrets.DISCORD_REVIEWS_CHANNEL_ID }}
      DISCORD_ALERTS_CHANNEL_ID: ${{ secrets.DISCORD_ALERTS_CHANNEL_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      ARTIFACT_KEY: ${{ secrets.ARTIFACT_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      CHROME_PATH: /usr/bin/google-chrome
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: "Data repo (private: database, stories, status)"
        uses: actions/checkout@v4
        with: {repository: "${{ github.repository_owner }}/hollow-floor-data", ssh-key: "${{ secrets.DATA_DEPLOY_KEY }}", path: hfdata}
      - name: Link data
        run: |
          rm -rf stories data && mkdir -p hfdata/stories hfdata/data
          ln -s hfdata/stories stories && ln -s hfdata/data data
      - name: Test run? use a throwaway database copy
        if: github.event_name == 'workflow_dispatch' && inputs.scratch
        run: |
          cp hfdata/data/hollowfloor.db "$RUNNER_TEMP/scratch.db"
          echo "HF_DB=$RUNNER_TEMP/scratch.db" >> "$GITHUB_ENV"
          echo "HF_MAX_RENDERS=1" >> "$GITHUB_ENV"
          echo "HF_TEST_LABEL=TEST RUN - nothing will be posted, no need to react" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: "requirements-cloud.txt\nrequirements-voice.txt"}
      - name: Anything to render this run?   # standard library only, so light runs skip the big installs
        id: need
        run: echo "render=$(python -m hollowfloor.pipeline needs-render)" >> "$GITHUB_OUTPUT"
      - if: steps.need.outputs.render == 'true'
        run: pip install -r requirements-cloud.txt
      # --- heavy tools only when a video must be rendered ---
      - if: steps.need.outputs.render == 'true'
        uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - if: steps.need.outputs.render == 'true'
        run: npm ci && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - if: steps.need.outputs.render == 'true'
        uses: actions/cache@v4
        with: {path: "models\n~/.cache/huggingface", key: models-kokoro-v1-int8-whisper-base-en-chatterbox-0.1.7}
      - if: steps.need.outputs.render == 'true'
        name: Expressive voice (Chatterbox, CPU, own venv)
        run: python -m venv .venv-cbx && .venv-cbx/bin/pip install -q --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-voice.txt
      - if: steps.need.outputs.render == 'true'
        name: Voice model (first run only)
        run: |
          mkdir -p models && cd models
          for f in kokoro-v1.0.int8.onnx voices-v1.0.bin; do [ -f "$f" ] || curl -sSfL -o "$f" "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f"; done
      # public repo = public logs: the pipeline's own log (story titles, errors) goes to the private data repo instead
      - name: Run pipeline (log kept privately in hollow-floor-data/data/logs)
        run: |
          mkdir -p data/logs; rc=0
          python -m hollowfloor.pipeline tick ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} > "data/logs/tick-${{ github.run_id }}.log" 2>&1 || rc=$?
          ls -t data/logs/*.log | tail -n +61 | xargs -r rm   # keep the last 60
          echo "pipeline exit code $rc (details: data/logs/tick-${{ github.run_id }}.log in the data repo)"; exit $rc
      - name: Encrypt new renders (a public repo's artifacts can be downloaded by anyone)
        if: always() && hashFiles('out/_new/**') != ''
        run: tar -C out/_new -czf - . | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:ARTIFACT_KEY -out out/renders.enc
      - name: Keep new renders for later runs (5 days)
        if: always() && hashFiles('out/_new/**') != ''
        uses: actions/upload-artifact@v4
        with: {name: "renders-${{ github.run_id }}", path: out/renders.enc, retention-days: 5}
      - name: Save database and status
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.scratch)
        run: |
          cd hfdata && git config user.name "hollow-floor-bot" && git config user.email "noreply@localhost"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "run ${{ github.run_id }}"
          # someone may have pushed a new story file meanwhile: rebase onto it and retry (story files never conflict)
          for i in 1 2 3; do git push -q && exit 0; git pull --rebase -q || { git rebase --abort; exit 1; }; done
          exit 1
      - name: Two failed runs in a row -> open an issue
        if: always() && hashFiles('data/ALERT_TWO_FAILURES') != ''
        run: |
          gh issue create --title "Hollow Floor - two pipeline runs failed in a row" --body "Details are in the private data repo: data/status.md and data/logs/tick-${{ github.run_id }}.log"
